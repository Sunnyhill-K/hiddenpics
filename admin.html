  return '<a class="' + cls + '" title="원본 보기(새 탭)" href="' + u + '" target="_blank" rel="noopener">' + inner + '</a>'; }
function drvA(id, label){ var u = 'https://drive.google.com/file/d/' + esc(id) + '/view';
  if (ANDROID) label = label === '원본 보기' ? '원본 보기(앱)' : label.replace('드라이브에서', '드라이브 앱에서');   // 11-25 폰에서 새 판이 떴는지 글자로 알아보게
